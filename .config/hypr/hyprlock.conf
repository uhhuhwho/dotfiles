# ═══════════════════════════════════════════════════════════════════════
#  Hyprlock - Modern Split Dashboard Theme
#  Catppuccin Mocha Palette & Frosted Glass Styling
# ═══════════════════════════════════════════════════════════════════════

$font = CaskaydiaCove Nerd Font

# ─────────────────────────────────────────────────────────────────────────
#  General Settings
# ─────────────────────────────────────────────────────────────────────────
general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = false
    immediate_render = true
}

# ─────────────────────────────────────────────────────────────────────────
#  Animations
# ─────────────────────────────────────────────────────────────────────────
animations {
    enabled = true
    bezier = glassEase, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, glassEase
    animation = fadeOut, 1, 4, glassEase
    animation = inputFieldDots, 1, 3, glassEase
}

# ─────────────────────────────────────────────────────────────────────────
#  Background – Frosted Glass Screenshot with Deep Tint
# ─────────────────────────────────────────────────────────────────────────
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    noise = 0.02
    contrast = 0.95
    brightness = 0.65
    vibrancy = 0.2
    vibrancy_darkness = 0.25
    color = rgba(17, 17, 27, 1.0)
}

# ═══════════════════════════════════════════════════════════════════════
#  TOP BAR WIDGETS
# ═══════════════════════════════════════════════════════════════════════

# Top Left: System Uptime & Host
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/hyprlock-sysinfo.sh
    color = rgba(166, 173, 200, 0.85)
    font_size = 13
    font_family = $font

    position = 35, -24
    halign = left
    valign = top
}

# Top Right: Network (Wi-Fi)
label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/hyprlock-network.sh
    color = rgba(116, 199, 236, 0.9)
    font_size = 13
    font_family = $font

    position = -135, -24
    halign = right
    valign = top
}

# Top Right: Battery
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/hyprlock-battery.sh
    color = rgba(166, 227, 161, 0.95)
    font_size = 13
    font_family = $font

    position = -35, -24
    halign = right
    valign = top
}

# ═══════════════════════════════════════════════════════════════════════
#  LEFT DASHBOARD: Time, Date, Media Player
# ═══════════════════════════════════════════════════════════════════════

# Large Digital Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")<span foreground='##89b4fa'>:</span>$(date +"%M")"
    color = rgba(205, 214, 244, 1.0)
    font_size = 84
    font_family = $font

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)

    position = -330, 90
    halign = center
    valign = center
}

# Date Label
label {
    monitor =
    text = cmd[update:60000] date +"󰃭  %A, %d %B %Y"
    color = rgba(186, 194, 222, 0.85)
    font_size = 17
    font_family = $font

    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)

    position = -330, 15
    halign = center
    valign = center
}

# Media Player Card (Shape Backdrop)
shape {
    monitor =
    size = 460, 52
    color = rgba(255, 255, 255, 0.05)
    rounding = 16
    border_size = 1
    border_color = rgba(137, 180, 250, 0.25)

    shadow_passes = 1
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.3)

    position = -330, -70
    halign = center
    valign = center
}

# Media Player Label (Now Playing)
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/hyprlock-media.sh
    color = rgba(205, 214, 244, 0.9)
    font_size = 12
    font_family = $font

    position = -330, -70
    halign = center
    valign = center
}

# ═══════════════════════════════════════════════════════════════════════
#  RIGHT DASHBOARD: Login Card, Avatar, Password Input
# ═══════════════════════════════════════════════════════════════════════

# Frosted Glass Card Container
shape {
    monitor =
    size = 350, 390
    color = rgba(17, 17, 27, 0.55)
    rounding = 24
    border_size = 1
    border_color = rgba(255, 255, 255, 0.1)

    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.4)

    position = 330, 0
    halign = center
    valign = center
}

# User Profile Avatar
image {
    monitor =
    path = /home/badreddine/.face
    size = 96
    rounding = -1
    border_size = 3
    border_color = rgba(137, 180, 250, 0.8)

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)

    position = 330, 110
    halign = center
    valign = center
}

# Greeting (Time-based dynamic greeting)
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/hyprlock-greeting.sh
    color = rgba(205, 214, 244, 0.95)
    font_size = 16
    font_family = $font

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.3)

    position = 330, 35
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 270, 48
    outline_thickness = 2
    rounding = 14

    inner_color = rgba(255, 255, 255, 0.08)
    outer_color = rgba(137, 180, 250, 0.6) rgba(116, 199, 236, 0.45) 45deg
    check_color = rgba(166, 227, 161, 0.8) rgba(148, 226, 213, 0.6) 120deg
    fail_color = rgba(243, 139, 168, 0.8) rgba(235, 111, 146, 0.6) 40deg
    capslock_color = rgba(249, 226, 175, 0.85) rgba(250, 179, 135, 0.7) 45deg

    font_color = rgba(205, 214, 244, 0.95)
    fade_on_empty = false
    font_family = $font

    placeholder_text = <span foreground="##a6adc8">Password...</span>
    fail_text = <span foreground="##f38ba8">Authentication failed</span>

    dots_size = 0.28
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    dots_fade_time = 180

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.3)

    position = 330, -35
    halign = center
    valign = center
}

# Caps Lock Indicator
label {
    monitor =
    text = cmd[update:250] awk '{if ($0 == 1) print "󰘲 CAPS LOCK ACTIVE"}' /sys/class/leds/input*::capslock/brightness 2>/dev/null
    color = rgba(249, 226, 175, 1.0)
    font_size = 11
    font_family = $font

    position = 330, -82
    halign = center
    valign = center
}

# Keyboard Layout Indicator
label {
    monitor =
    text = $LAYOUT[en,ar]
    color = rgba(148, 226, 213, 0.85)
    font_size = 12
    font_family = $font
    onclick = hyprctl switchxkblayout all next

    position = 330, -112
    halign = center
    valign = center
}

# ═══════════════════════════════════════════════════════════════════════
#  BOTTOM BAR: Lock Session Indicator
# ═══════════════════════════════════════════════════════════════════════
label {
    monitor =
    text = 
    color = rgba(255, 255, 255, 0.2)
    font_size = 20
    font_family = $font

    position = 0, 25
    halign = center
    valign = bottom
}
