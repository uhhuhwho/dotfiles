# Hyprtoolkit Configuration - Dracula Theme
# Location: ~/.config/hypr/hyprtoolkit.conf

# Dracula Color Palette (0xAARRGGBB format)
background         = 0xFF282A36
base               = 0xFF343746
text               = 0xFFF8F8F2
alternate_base     = 0xFF44475A
bright_text        = 0xFFFF79C6
accent             = 0xFFFF79C6
accent_secondary   = 0xFFBD93F9

# Typography & Font Sizes
font_family        = Adwaita Sans
font_family_monospace = CaskaydiaCove Nerd Font Mono
h1_size            = 18
h2_size            = 14
h3_size            = 12
font_size          = 11
small_font_size    = 10

# Icons
icon_theme         = Papirus-Dark

# Window & Element Rounding (in logical pixels)
rounding_large     = 12
rounding_small     = 6
