"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](sapphire)\
$os\
$username\
[](bg:blue fg:sapphire)\
$directory\
[](bg:sky fg:blue)\
$git_branch\
$git_status\
$git_metrics\
[](fg:sky bg:teal)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:teal bg:lavender)\
$docker_context\
$conda\
[](fg:lavender bg:mauve)\
$memory_usage\
[](fg:mauve bg:sapphire)\
$cmd_duration\
$time\
[ ](fg:sapphire)\
$line_break\
$jobs\
$battery\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:sapphire fg:base"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:sapphire fg:base"
style_root = "bg:sapphire fg:red"
format = '[  $user ]($style)'

[directory]
style = "bg:blue fg:base"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "bg:blue fg:red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:sky"
format = '[[  $symbol $branch ](fg:base bg:sky)]($style)'

[git_status]
style = "bg:sky"
format = '[[ ($all_status$ahead_behind) ](fg:base bg:sky)]($style)'
conflicted = "⚔️"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}${behind_count}"
untracked = "?"
stashed = "󰏗"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# Show lines added/removed in git repos
[git_metrics]
disabled = false
added_style = "fg:green bg:sky"
deleted_style = "fg:red bg:sky"
format = '[[ +$added]($added_style)[-$deleted]($deleted_style)  ](bg:sky)'
only_nonzero_diffs = true

[nodejs]
symbol = ""
style = "bg:teal"
format = '[[  $symbol( $version) ](fg:base bg:teal)]($style)'

[c]
symbol = " "
style = "bg:teal"
format = '[[  $symbol( $version) ](fg:base bg:teal)]($style)'

[rust]
symbol = ""
style = "bg:teal"
format = '[[  $symbol( $version) ](fg:base bg:teal)]($style)'

[golang]
symbol = ""
style = "bg:teal"
format = '[[  $symbol( $version) ](fg:base bg:teal)]($style)'

[php]
symbol = ""
style = "bg:teal"
format = '[[  $symbol( $version) ](fg:base bg:teal)]($style)'

[java]
symbol = " "
style = "bg:teal"
format = '[[  $symbol( $version) ](fg:base bg:teal)]($style)'

[kotlin]
symbol = ""
style = "bg:teal"
format = '[[  $symbol( $version) ](fg:base bg:teal)]($style)'

[haskell]
symbol = ""
style = "bg:teal"
format = '[[  $symbol( $version) ](fg:base bg:teal)]($style)'

[python]
symbol = ""
style = "bg:teal"
format = '[[  $symbol( $version)(\($virtualenv\)) ](fg:base bg:teal)]($style)'

[docker_context]
symbol = ""
style = "bg:lavender"
format = '[[  $symbol( $context) ](fg:base bg:lavender)]($style)'
only_with_files = true

[conda]
symbol = "  "
style = "fg:base bg:lavender"
format = '[  $symbol$environment  ]($style)'
ignore_base = false

# Memory usage indicator (matches Waybar's memory module color)
[memory_usage]
disabled = false
threshold = 75
symbol = "󰍛"
style = "fg:base bg:mauve"
format = '[[  $symbol $ram( | $swap) ](fg:base bg:mauve)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:sapphire"
format = '[[   $time  ](fg:base bg:sapphire)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:teal)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:teal)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:sky)'

[cmd_duration]
min_time = 500
show_milliseconds = true
format = "[[  󱎫 $duration ](fg:base bg:sapphire)]($style)"
style = "bg:sapphire"
show_notifications = true
min_time_to_notify = 45000

# Show background jobs
[jobs]
symbol = "✦"
style = "bold sky"
number_threshold = 1
format = "[$symbol$number]($style) "

# Battery indicator (matches Waybar battery colors)
[battery]
disabled = false
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold teal"

