[general]
font-sans = "Noto Sans"
font-mono = "FiraCode Nerd Font Mono"
tearing-mode = true

[bar]
scale = 0.75
padding = 0.5
module-gap = 0.30000001192092896
bg = "transparent"
background-opacity = 80
border-location = "bottom"
border-color = "status-success-subtle"
shadow = "drop"
button-variant = "icon-square"
button-icon-size = 1.5

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "cpu",
    "ram",
    "storage",
    "hyprland-workspaces",
    "media",
    "separator",
]
center = [
    "separator",
    "separator",
]
right = [
    "separator",
    "notifications",
    "systray",
    "microphone",
    "volume",
    "idle-inhibit",
    "keyboard-input",
    "hyprsunset",
    "brightness",
    "battery",
    "clock",
]

[styling]
matugen-scheme = "rainbow"

[styling.palette]
bg = "#11111b"
surface = "#181825"
elevated = "#1e1e2e"
fg = "#cdd6f4"
fg-muted = "#bac2de"
primary = "#b4befe"
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
blue = "#74c7ec"

[modules.brightness]
scroll-up = "brightnessctl set 1%+"
scroll-down = "brightnessctl set 1%-"

[modules.cava]
bars = 15
stereo = true
style = "peaks"

[modules.clock]
format = "%I:%M %p"
dropdown-show-seconds = true

[modules.dashboard]
icon-bg-color = "accent"
right-click = "dropdown:dashboard"

[modules.hyprland-workspaces]
min-workspace-count = 8
display-mode = "icon"
app-icons-show = true
workspace-padding = 1.5
icon-size = 1.350000023841858
label-size = 1.350000023841858

[modules.media]
icon-type = "spinning-disc"
label-max-length = 15

[modules.network]
label-show = false

[modules.notifications]
popup-max-visible = 10

[modules.power]
left-click = "wlogout"

[modules.storage]
format = "{{ percent }}% {{free_gib}} GiB"

[modules.systray]
icon-scale = 1.5

[wallpaper]
engine-enabled = false
