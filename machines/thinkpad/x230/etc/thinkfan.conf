# ==============================================================================
# ThinkPad X230 Customized Thinkfan Configuration
# ==============================================================================

# 1. Sensor Drivers (Using name-based search to handle dynamic boot order)
sensors:
  # ThinkPad Platform Sensor
  - hwmon: /sys/class/hwmon
    name: thinkpad
    indices: [1]

  # Intel CPU Core Digital Thermal Sensors
  - hwmon: /sys/class/hwmon
    name: coretemp
    indices: [1]

# 2. Fan Driver Interface
# Note: On ThinkPads, using the legacy 'tpacpi' keyword allows thinkfan to utilize 
# the native "level auto" and "level disengaged" states via the driver hooks.
fans:
  - tpacpi: /proc/acpi/ibm/fan

# 3. Dynamic Fan Speed Profile (Simple Mode)
# Format: [SPEED, DOWN_TRIP, UP_TRIP]
# Only the highest temperature among the sensors dictates the current level.
levels:
  - [0,                   0,  53]  # Silent when idling or just browsing
  - [1,                  48,  58]  # Low, gentle breeze
  - [3,                  54,  64]  # Mid-range scale
  - [5,                  60,  70]  # Noticeable, heavy workload stepping
  - [7,                  66,  78]  # Maximum standard hardware speed
  - ["level auto",       74,  84]  # Let Embedded Controller take native control if hot
  - ["level disengaged", 80, 32767] # Pure unrestricted RPM for compiling or rendering
